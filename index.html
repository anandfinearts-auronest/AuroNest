<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuroNest Store</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<!-- Header -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">AuroNest Store</h1>

    <button onclick="showCart()" class="relative bg-black text-white px-4 py-2 rounded">
        Cart 🛒
        <span data-cart-count class="absolute -top-2 -right-2 bg-red-500 text-xs px-2 rounded-full">0</span>
    </button>
</div>

<!-- Products -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">

    <div class="bg-white p-4 rounded shadow">
        <h2 class="font-bold">Coffee Beans</h2>
        <p>$24</p>
        <button onclick="addToCart('Coffee Beans', 24)" class="mt-2 bg-black text-white px-3 py-1 rounded">
            Add to Cart
        </button>
    </div>

    <div class="bg-white p-4 rounded shadow">
        <h2 class="font-bold">Hand Wash</h2>
        <p>$18</p>
        <button onclick="addToCart('Hand Wash', 18)" class="mt-2 bg-black text-white px-3 py-1 rounded">
            Add to Cart
        </button>
    </div>

    <div class="bg-white p-4 rounded shadow">
        <h2 class="font-bold">Floor Cleaner</h2>
        <p>$32</p>
        <button onclick="addToCart('Floor Cleaner', 32)" class="mt-2 bg-black text-white px-3 py-1 rounded">
            Add to Cart
        </button>
    </div>

</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
